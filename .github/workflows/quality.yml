# Generated fork-only validation wrapper. Source and wrapper SHAs are intentionally distinct.
name: Fork validation / Quality Gates
'on':
  push:
    branches:
    - validate/fal-pr18849-99699ff0
concurrency:
  group: fork-validation-quality.yml-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  OMNIROUTE_SKIP_SYSTEM_TRUST: '1'
  CI_NODE_VERSION: '24'
  VALIDATION_SOURCE_SHA: 99699ff06eb08df5c629de8889bf2575fbfcc25c
  VALIDATION_BASE_SHA: b0d07eb78e706a32939cb1121b3760350b9a5259
  VALIDATION_FORK: KiaroSama/OmniRoute
  VALIDATION_BRANCH: validate/fal-pr18849-99699ff0
jobs:
  changes:
    name: Change Classification
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (!(github.event_name == 'pull_request' && github.event.action ==
      'edited' && github.event.pull_request.user.login == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/')
      && github.event.pull_request.head.repo.id == github.event.repository.id)) }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
      i18n: ${{ steps.classify.outputs.i18n }}
      workflow: ${{ steps.classify.outputs.workflow }}
      testsOnly: ${{ steps.classify.outputs.testsOnly }}
      domains: ${{ steps.classify.outputs.domains }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@v7
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - name: Validate gate inventory
      run: npm run check:gate-manifest
    - name: Validate recurring free catalog evidence
      env:
        BASE_SHA: b0d07eb78e706a32939cb1121b3760350b9a5259
      run: npm run check:free-catalog-evidence
    - id: classify
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "$EVENT_NAME" != "pull_request" ]; then
          {
            echo "code=true"
            echo "docs=true"
            echo "i18n=true"
            echo "workflow=true"
            echo "testsOnly=false"
            echo "domains=build,catalog,cli,core,db,docs,i18n,provider,routing,tests,ui,workflow"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
        node scripts/quality/classify-pr-changes.mjs changed-files.txt >> "$GITHUB_OUTPUT"
  docs-gates:
    name: Docs Gates (fast-path)
    needs: changes
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (github.event_name != 'pull_request' || ((github.event.pull_request.draft
      == false || startsWith(github.head_ref, 'mergify/merge-queue/')) && (needs.changes.outputs.docs == 'true' || needs.changes.outputs.code
      == 'true'))) }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@v7
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - uses: ./.github/actions/npm-ci-retry
      with:
        cache: ${{ github.event_name == 'pull_request' }}
    - run: npm run check:api-docs-refs
    - name: Docs accuracy (fabricated-docs + i18n mirrors, strict)
      run: npm run check:docs-all
  fast-gates:
    name: Fast Quality Gates
    needs: changes
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (github.event_name != 'pull_request' || ((github.event.pull_request.draft
      == false || startsWith(github.head_ref, 'mergify/merge-queue/')) && needs.changes.outputs.code == 'true')) }}
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-lint-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-lint-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: 'true'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@v7
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - uses: ./.github/actions/npm-ci-retry
      with:
        cache: ${{ github.event_name == 'pull_request' }}
    - name: Restore ESLint file cache
      if: github.event_name == 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .eslintcache
          .eslintcache-complexity
        key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'eslint.complexity-ratchets.config.mjs', 'config/quality/eslint-suppressions.json',
          'package-lock.json') }}
    - name: Install security scanners (gitleaks/osv/actionlint/zizmor/oasdiff)
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        mkdir -p "$HOME/.local/bin"
        # Ratchets compare scanner COUNTS across runs. Pin every auditor: a rule-set
        # update must be an explicit PR that re-measures/rebaselines, never a random
        # red (or green) caused by whatever "latest" served that morning.
        GITLEAKS_VERSION=v8.30.1
        OSV_SCANNER_VERSION=v2.3.8
        ACTIONLINT_VERSION=v1.7.12
        ZIZMOR_VERSION=1.25.2
        OASDIFF_VERSION=v1.19.1
        # gitleaks — pinned linux x64 tarball via gh (authed), extract binary
        rm -rf /tmp/gl && mkdir -p /tmp/gl
        gh release download "$GITLEAKS_VERSION" --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --dir /tmp/gl
        tar -xzf /tmp/gl/*linux_x64.tar.gz -C "$HOME/.local/bin" gitleaks
        # osv-scanner — pinned linux amd64 bare binary via gh (authed)
        rm -rf /tmp/osv && mkdir -p /tmp/osv
        gh release download "$OSV_SCANNER_VERSION" --repo google/osv-scanner --pattern '*linux_amd64' --dir /tmp/osv
        install -m 0755 /tmp/osv/*linux_amd64 "$HOME/.local/bin/osv-scanner"
        # actionlint — official installer from a pinned release tag (never main)
        bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION#v}" "$HOME/.local/bin"
        # zizmor — pinned PyPI package (same version as ci.yml quality-extended)
        pipx install "zizmor==$ZIZMOR_VERSION" || pip install --user "zizmor==$ZIZMOR_VERSION"
        # oasdiff — pinned linux amd64 tarball via gh (authed), extract binary
        rm -rf /tmp/oasd && mkdir -p /tmp/oasd
        gh release download "$OASDIFF_VERSION" --repo Tufin/oasdiff --pattern '*linux_amd64.tar.gz' --dir /tmp/oasd
        tar -xzf /tmp/oasd/*linux_amd64.tar.gz -C "$HOME/.local/bin" oasdiff
        # ALWAYS export the bin dir (even if any step above failed)
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/gitleaks" version || true
        "$HOME/.local/bin/actionlint" -version || true
        "$HOME/.local/bin/osv-scanner" --version || true
        "$HOME/.local/bin/oasdiff" --version || true
        zizmor --version || true
    - name: Forgotten sibling tests (advisory)
      env:
        GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        node scripts/quality/build-test-impact-map.mjs
        node scripts/check/check-forgotten-sibling-tests.mjs \
          --summary-file forgotten-sibling-tests.md \
          --json-file forgotten-sibling-tests.json
        cat forgotten-sibling-tests.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload forgotten sibling report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: forgotten-sibling-tests
        path: |
          forgotten-sibling-tests.md
          forgotten-sibling-tests.json
        if-no-files-found: ignore
        retention-days: 30
    - name: Quality gates (all, non-fail-fast)
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
      run: |
        set -uo pipefail
        gates=(
          provider-consistency provider-asset-provenance fetch-targets deps file-size error-helper
          migration-numbering public-creds db-rules known-symbols
          route-guard-membership test-discovery test-runner-api
          mutation-test-coverage any-budget:t11 build-scope pack-policy
          complexity-ratchets model-lifecycle
          lockfile duplication dead-code type-coverage compression-budget
          # #8781: open-sse workspace typecheck gate — the workspace imports @/ which
          # escapes to src/ via undeclared path aliases. See check-open-sse-typecheck.mjs.
          open-sse-typecheck
          # Hard Rule #16 — AI/bot attribution in PR commits, title or body (#14436). Reads the PR
          # from GITHUB_EVENT_PATH; no-op on non-PR events. ci.yml only runs on PRs to main.
          ai-attribution
        )
        # Ratchet-mode gates append --ratchet. `cycles` belongs here since #15281
        # (69cb18dca8): check-cycles.mjs exits 1 on ANY cycle without --ratchet, and
        # the frozen ceiling lives in quality-baseline.json → metrics.cycles — same
        # `check:cycles:ratchet` semantics ci.yml runs (base-red #15306). `boundary`
        # caps the open-sse → src edge count (measure-boundary.mjs --ratchet, ceiling
        # quality-baseline.json → metrics.boundaryOpenSseToSrc) — same as ci.yml lint.
        ratchet_gates=(
          secrets vuln-ratchet workflows openapi-breaking cycles boundary
        )
        failed=()
        for g in "${gates[@]}"; do
          echo "::group::check:$g"
          # #8522: file-size is base-relative on PR events (compare against
          # max(frozen, base)) so inherited drift doesn't red an innocent PR;
          # workflow_dispatch (no PR base) falls back to absolute comparison.
          # New-code mode (Clean-as-You-Code, 2026-08-30): complexity-ratchets and
          # dead-code compare the PR's files against the merge-base and block only on
          # what the PR added; the global totals are advisory on PRs and re-frozen at
          # release. See scripts/check/newCodeMode.mjs.
          case "$g" in file-size|complexity-ratchets|dead-code) NEW_CODE=1 ;; *) NEW_CODE= ;; esac
          if [ -n "$NEW_CODE" ] && [ -n "${PR_BASE_SHA:-}" ]; then
            npm run "check:$g" -- --base-ref "$PR_BASE_SHA" || failed+=("$g")
          else
            npm run "check:$g" || failed+=("$g")
          fi
          echo "::endgroup::"
        done
        for g in "${ratchet_gates[@]}"; do
          echo "::group::check:$g (ratchet)"
          # boundary is base-relative on PR events, like file-size (#8522): the ceiling
          # becomes max(baseline ceiling, edges on the PR base), so open-sse → src edges
          # other merges added after the seed never red an innocent PR; only edges this
          # PR adds block. workflow_dispatch (no PR base) keeps the absolute ceiling.
          case "$g" in boundary) BASE_RELATIVE=1 ;; *) BASE_RELATIVE= ;; esac
          if [ -n "$BASE_RELATIVE" ] && [ -n "${PR_BASE_SHA:-}" ]; then
            npm run "check:$g" -- --ratchet --base-ref "$PR_BASE_SHA" || failed+=("$g")
          else
            npm run "check:$g" -- --ratchet || failed+=("$g")
          fi
          echo "::endgroup::"
        done
        echo "::group::typecheck:core"
        npm run typecheck:core || failed+=("typecheck:core")
        echo "::endgroup::"
        echo "::group::check:dashboard-typecheck"
        npm run check:dashboard-typecheck || failed+=("check:dashboard-typecheck")
        echo "::endgroup::"
        echo "::group::check:build-typecheck"
        npm run check:build-typecheck || failed+=("check:build-typecheck")
        echo "::endgroup::"
        # #10134: TS7 zero-new-diagnostics ratchet — folded into this non-fail-fast
        # loop (never a separate blocking step) so an earlier red gate cannot abort
        # the job and mask it (#8542 mechanism). PR-only: the base-relative
        # comparison needs the PR base SHA (empty on workflow_dispatch).
        if [ -n "${PR_BASE_SHA:-}" ]; then
          echo "::group::check:ts7-diagnostics-ratchet"
          npm run check:ts7-diagnostics-ratchet -- --base-ref "$PR_BASE_SHA" || failed+=("ts7-diagnostics-ratchet")
          echo "::endgroup::"
        fi
        if (( ${#failed[@]} )); then
          printf '::error::%d gate(s) failed: %s\n' "${#failed[@]}" "${failed[*]}"
          exit 1
        fi
    - name: Typecheck (core) — TS7 native shadow (advisory)
      continue-on-error: true
      run: |
        RC=0
        START=$(date +%s)
        npm exec --yes --package=typescript@7.0.2 -- tsc --pretty false -p tsconfig.typecheck-core.json || RC=$?
        echo "[ts7-shadow] exit=$RC elapsed=$(( $(date +%s) - START ))s — the 6.x step above stays authoritative"
        exit $RC
    - name: Impacted unit tests (TIA subset; blocking)
      env:
        GITHUB_BASE_REF: ${{ github.base_ref }}
      run: |
        git fetch --no-tags origin "$GITHUB_BASE_REF" || true
        # The advisory sibling-test step generates the same map earlier in this job.
        [ -f config/quality/test-impact-map.json ] || node scripts/quality/build-test-impact-map.mjs
        SEL="$(node scripts/quality/select-impacted-tests.mjs)"
        # Shadow evidence (#8084): persist every selection so TIA false negatives can
        # be measured against ci.yml test-unit's full-suite verdict across releases BEFORE
        # any gate authority moves off ordinary PRs. Artifact uploaded below.
        printf '%s\n' "$SEL" > tia-selection.txt
        if [ -z "$SEL" ]; then
          echo "TIA selection: empty (no source/test changes)" >> "$GITHUB_STEP_SUMMARY"
          echo "No source/test changes — skipping unit tests"; exit 0
        fi
        # CI runners are 4-vCPU; run at --test-concurrency=4 (matching the ci.yml unit
        # job) rather than test:unit's local-tuned concurrency=20. Oversubscribing the
        # runner makes timing-sensitive tests (db-backup, upstream-timeout, ...) flake,
        # which must not happen on a blocking gate. DATA_DIR isolation keeps the parallel
        # run race-free regardless of concurrency.
        if echo "$SEL" | grep -q "__RUN_ALL__"; then
          echo "TIA selection: __RUN_ALL__ (fail-safe) — full-suite authority stays with ci.yml test-unit" >> "$GITHUB_STEP_SUMMARY"
          echo "Fail-safe: __RUN_ALL__ — deferring FULL unit suite to ci.yml test-unit (8-shard)."
          echo "Not re-running unsharded test:unit:ci here (duplicate of test-unit coverage)."
          exit 0
        fi
        echo "TIA selection: $(grep -c . tia-selection.txt) impacted test file(s) — full suite still runs in ci.yml test-unit (shadow-evidence phase, #8084)" >> "$GITHUB_STEP_SUMMARY"
        echo "Running impacted tests:"; echo "$SEL"
        mapfile -t FILES <<< "$SEL"
        # Loader parity with test:unit:ci:shard (#6787): tests/unit/dashboard/** runs
        # under `--import tsx` (CJS transform — required for ESM-only deep imports like
        # @lobehub/icons/es/* reached via lobeProviderIcons.ts); everything else under
        # `--import tsx/esm`. A single tsx/esm invocation false-reds every dashboard
        # module-shape test the impact map selects ("Unexpected token 'export'").
        DASH=(); REST=()
        for f in "${FILES[@]}"; do
          case "$f" in
            tests/unit/dashboard/*) DASH+=("$f") ;;
            *) REST+=("$f") ;;
          esac
        done
        RC=0
        if [ ${#REST[@]} -gt 0 ]; then
          node --import tsx/esm --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --test --test-force-exit --test-concurrency=4 "${REST[@]}" || RC=$?
        fi
        if [ ${#DASH[@]} -gt 0 ]; then
          node --import tsx --import ./open-sse/utils/setupPolyfill.ts --import ./tests/_setup/isolateDataDir.ts --test --test-force-exit --test-concurrency=4 "${DASH[@]}" || RC=$?
        fi
        exit $RC
    - name: Upload TIA selection (shadow evidence)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: tia-selection
        path: tia-selection.txt
        if-no-files-found: ignore
        retention-days: 30
  lint-guard:
    name: No new ESLint warnings
    needs: changes
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (github.event_name != 'pull_request' || ((github.event.pull_request.draft
      == false || startsWith(github.head_ref, 'mergify/merge-queue/')) && needs.changes.outputs.code == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@v7
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - uses: ./.github/actions/npm-ci-retry
      with:
        cache: ${{ github.event_name == 'pull_request' }}
    - name: Restore ESLint file cache
      if: github.event_name == 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .eslintcache
          .eslintcache-complexity
        key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'eslint.complexity-ratchets.config.mjs', 'config/quality/eslint-suppressions.json',
          'package-lock.json') }}
    - name: ESLint (baseline congelado — warning novo = vermelho)
      run: npm run lint:json -- --max-warnings 0
      env:
        NODE_OPTIONS: --max-old-space-size=8192
    - run: npm run quality:collect
    - name: Ratchet check (blocking)
      run: node scripts/quality/check-quality-ratchet.mjs --allow-missing --summary .artifacts/quality-ratchet.md
    - name: Require-tighten (blocking)
      run: node scripts/quality/check-quality-ratchet.mjs --allow-missing --require-tighten
    - name: CodeQL alerts ratchet (blocking)
      run: npm run check:codeql-ratchet
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Append ratchet summary
      if: always()
      run: cat .artifacts/quality-ratchet.md >> "$GITHUB_STEP_SUMMARY" || true
  merge-integrity:
    name: Merge integrity (changelog + generated skills)
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (github.event_name != 'pull_request' || (github.event.pull_request.draft
      == false || startsWith(github.head_ref, 'mergify/merge-queue/'))) }}
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-lint-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-lint-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - uses: ./.github/actions/npm-ci-retry
      with:
        cache: ${{ github.event_name == 'pull_request' }}
    - name: CHANGELOG integrity (nenhum bullet da base pode sumir no merge-result)
      run: npm run check:changelog-integrity
    - name: Agent-skills generator sync (SKILL.md gerado ≡ catálogo)
      run: npm run check:agent-skills-sync
  admission-verdict:
    name: ${{ (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.pull_request.user.login
      == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.head.repo.id ==
      github.event.repository.id) && 'Gate / Quality (queue-draft edit)' || 'Gate / Quality' }}
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (always() && !(github.event_name == 'pull_request' && github.event.action
      == 'edited' && github.event.pull_request.user.login == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/')
      && github.event.pull_request.head.repo.id == github.event.repository.id)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
    - changes
    - docs-gates
    - fast-gates
    - lint-guard
    - merge-integrity
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        persist-credentials: false
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - name: Evaluate exact-candidate admission
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        node --input-type=module <<'JS'
        import { execFileSync } from 'node:child_process';
        import { readFileSync, mkdirSync, writeFileSync, appendFileSync } from 'node:fs';
        import { evaluateAdmission } from './scripts/quality/admission-verdict.mjs';
        const profile = 'quality';
        const sha = process.env.VALIDATION_SOURCE_SHA;
        const wrapperSha = process.env.GITHUB_SHA;
        const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
        if (!/^[a-f0-9]{40}$/.test(sha) || !/^[a-f0-9]{40}$/.test(wrapperSha)) throw Error('Invalid identity');
        if (process.env.GITHUB_EVENT_NAME !== 'push' || event.after !== wrapperSha) throw Error('Not the expected wrapper push');
        if (process.env.GITHUB_REPOSITORY !== process.env.VALIDATION_FORK || process.env.GITHUB_REF !== `refs/heads/${process.env.VALIDATION_BRANCH}`) throw Error('Unexpected validation target');
        if (execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim() !== sha) throw Error('Wrong source checkout');
        const policy = JSON.parse(readFileSync('config/quality/admission-policy.json','utf8'));
        const report = evaluateAdmission(policy, profile, {
          event: process.env.GITHUB_EVENT_NAME, sha,
          runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
        }, JSON.parse(process.env.NEEDS_JSON));
        report.scope = 'Fork-only exact-source validation. GitHub check attaches to wrapper SHA, not upstream PR. Not a merge/publication/deployment receipt.';
        report.wrapperSha = wrapperSha;
        report.sourceSha = sha;
        report.baseSha = process.env.VALIDATION_BASE_SHA;
        report.repository = process.env.GITHUB_REPOSITORY;
        report.ref = process.env.GITHUB_REF;
        mkdirSync('.artifacts', {recursive:true});
        writeFileSync(`.artifacts/${profile}-admission.json`, JSON.stringify(report,null,2)+'\n');
        appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Fork ${policy.profiles[profile].checkName}: ${report.verdict}\n\nSource: ${sha}\n\nWrapper: ${wrapperSha}\n\n${report.errors.join('\n')}\n`);
        console.log(JSON.stringify(report,null,2));
        process.exitCode = report.verdict === 'PASS' ? 0 : 1;
        JS
    - name: Retain admission receipt
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: quality-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/quality-admission.json
        if-no-files-found: error
        retention-days: 14

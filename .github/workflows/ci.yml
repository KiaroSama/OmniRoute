# Generated fork-only validation wrapper. Source and wrapper SHAs are intentionally distinct.
name: Fork validation / CI
'on':
  push:
    branches:
    - validate/fal-pr18849-99699ff0
concurrency:
  group: fork-validation-ci.yml-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  OMNIROUTE_SKIP_SYSTEM_TRUST: '1'
  CI_NODE_VERSION: '24'
  CI_NODE_24_VERSION: '24'
  CI_NODE_26_VERSION: '26'
  VALIDATION_SOURCE_SHA: 99699ff06eb08df5c629de8889bf2575fbfcc25c
  VALIDATION_BASE_SHA: b0d07eb78e706a32939cb1121b3760350b9a5259
  VALIDATION_FORK: KiaroSama/OmniRoute
  VALIDATION_BRANCH: validate/fal-pr18849-99699ff0
jobs:
  changes:
    name: Change Classification
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (!(github.event_name == 'pull_request' && github.event.action ==
      'edited' && github.event.pull_request.user.login == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/')
      && github.event.pull_request.head.repo.id == github.event.repository.id)) }}
    runs-on: ubuntu-latest
    outputs:
      queueCandidate: |-
        ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true &&
            github.event.pull_request.user.id == 37929162 &&
            github.event.pull_request.user.login == 'mergify[bot]' &&
            github.event.pull_request.user.type == 'Bot' &&
            startsWith(github.head_ref, 'mergify/merge-queue/') &&
            github.event.repository.id > 0 &&
            github.event.pull_request.head.repo.id == github.event.repository.id &&
            github.event.pull_request.base.repo.id == github.event.repository.id }}
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
      i18n: ${{ steps.classify.outputs.i18n }}
      workflow: ${{ steps.classify.outputs.workflow }}
      testsOnly: ${{ steps.classify.outputs.testsOnly }}
      domains: ${{ steps.classify.outputs.domains }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@v7
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - name: Validate gate inventory
      run: npm run check:gate-manifest
    - name: Validate recurring free catalog evidence
      env:
        BASE_SHA: b0d07eb78e706a32939cb1121b3760350b9a5259
      run: npm run check:free-catalog-evidence
    - name: Reject a PR that targets its own branch
      if: github.event_name == 'pull_request'
      env:
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: node scripts/check/check-pr-self-target.mjs
    - id: classify
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # Single source of truth: scripts/quality/classify-pr-changes.mjs
        # (unit-tested). Push/dispatch always enable every lane.
        if [ "$EVENT_NAME" != "pull_request" ]; then
          {
            echo "code=true"
            echo "docs=true"
            echo "i18n=true"
            echo "workflow=true"
            echo "testsOnly=false"
            echo "domains=build,catalog,cli,core,db,docs,i18n,provider,routing,tests,ui,workflow"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
        node scripts/quality/classify-pr-changes.mjs changed-files.txt >> "$GITHUB_OUTPUT"
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (github.event_name != 'pull_request' || ((github.event.pull_request.draft
      == false || needs.changes.outputs.queueCandidate == 'true') && needs.changes.outputs.code == 'true')) }}
    env:
      JWT_SECRET: ci-lint-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-lint-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: 'true'
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@v7
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - uses: ./.github/actions/npm-ci-retry
      with:
        cache: ${{ github.event_name == 'pull_request' }}
    - run: npm run check:node-runtime
    - run: npm run audit:deps
    - name: Restore ESLint file cache
      if: github.event_name == 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .eslintcache
          .eslintcache-complexity
        key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'eslint.complexity-ratchets.config.mjs', 'config/quality/eslint-suppressions.json',
          'package-lock.json') }}
    - name: ESLint (JSON report)
      run: npm run lint:json
    - name: Upload ESLint results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: eslint-results
        path: .artifacts/eslint-results.json
        if-no-files-found: warn
        retention-days: 7
    - run: npm run check:cycles:ratchet
    - name: Boundary ratchet (open-sse → src)
      env:
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ -n "${PR_BASE_SHA:-}" ]; then
          npm run check:boundary:ratchet -- --base-ref "$PR_BASE_SHA"
        else
          npm run check:boundary:ratchet
        fi
    - run: npm run check:route-validation:t06
    - run: npm run check:any-budget:t11
    - run: npm run check:provider-consistency
    - run: npm run check:model-lifecycle
    - run: npm run check:provider-asset-provenance
    - run: npm run check:fetch-targets
    - run: npm run check:deps
    - run: npm run check:file-size
    - run: npm run check:error-helper
    - run: npm run check:migration-numbering
    - run: npm run check:public-creds
    - run: npm run check:db-rules
    - run: npm run check:known-symbols
    - run: npm run check:route-guard-membership
    - run: npm run check:test-discovery
    - run: npm run check:test-tla-order
    - run: npm run check:radar-sentinels
    - run: npm run check:tracked-artifacts
    - name: AI attribution in commit / PR metadata (Hard Rule
      if: github.event_name == 'pull_request'
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
        npm run check:ai-attribution -- --range "$PR_BASE_SHA..$PR_HEAD_SHA" --pr-title "$PR_TITLE" --pr-body-file "$RUNNER_TEMP/pr-body.md"
    - run: npm run check:vitest-exclusions
    - run: npm run check:agent-skills-sync
    - name: hadolint (Dockerfile)
      run: docker run --rm -i hadolint/hadolint@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e hadolint
        --failure-threshold error - < Dockerfile
    - run: npm run check:lockfile
    - run: npm run check:licenses
    - run: npm run typecheck:core
    - run: npm run check:dashboard-typecheck
    - run: npm run check:build-typecheck
      timeout-minutes: 5
  quality-gate:
    name: Quality Ratchet
    runs-on: ubuntu-latest
    needs:
    - changes
    - test-coverage
    - lint
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (!cancelled() && (github.event_name != 'pull_request' || ((github.event.pull_request.draft
      == false || needs.changes.outputs.queueCandidate == 'true') && needs.changes.outputs.code == 'true' && (needs.lint.result
      == 'success' || needs.lint.result == 'failure')))) }}
    permissions:
      contents: read
      security-events: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@v7
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - uses: ./.github/actions/npm-ci-retry
      with:
        cache: ${{ github.event_name == 'pull_request' }}
    - name: Restore ESLint file cache
      if: github.event_name == 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .eslintcache
          .eslintcache-complexity
        key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'eslint.complexity-ratchets.config.mjs', 'config/quality/eslint-suppressions.json',
          'package-lock.json') }}
    - uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: coverage-report
        path: coverage/
    - name: Download ESLint results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: eslint-results
        path: .artifacts/
    - run: npm run quality:collect
    - name: Ratchet check
      run: node scripts/quality/check-quality-ratchet.mjs --allow-missing --summary .artifacts/quality-ratchet.md
    - name: Require-tighten (blocking)
      run: node scripts/quality/check-quality-ratchet.mjs --allow-missing --require-tighten
    - name: Duplication ratchet
      run: npm run check:duplication
    - name: Complexity + cognitive ratchets
      run: npm run check:complexity-ratchets
    - name: Dead-code ratchet (knip)
      run: npm run check:dead-code
    - name: Type coverage ratchet
      run: npm run check:type-coverage
    - name: Compression budget ratchet (F2.4 / N4)
      run: npm run check:compression-budget
    - name: CodeQL alerts ratchet (blocking)
      run: npm run check:codeql-ratchet
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Append summary
      if: always()
      run: cat .artifacts/quality-ratchet.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload ratchet report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: quality-ratchet
        path: .artifacts/quality-ratchet.md
        if-no-files-found: warn
  quality-extended:
    name: Quality Gates (Extended)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (github.event_name != 'pull_request' || ((github.event.pull_request.draft
      == false || needs.changes.outputs.queueCandidate == 'true') && needs.changes.outputs.code == 'true')) }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@v7
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - uses: ./.github/actions/npm-ci-retry
      with:
        cache: ${{ github.event_name == 'pull_request' }}
    - name: Circular deps (dpdm; advisory)
      continue-on-error: true
      run: npm run check:circular-deps
    - name: Bundle size (ratchet, blocking)
      run: npm run check:bundle-size -- --ratchet
    - name: Install advisory security scanners (gitleaks/osv/actionlint/zizmor)
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        mkdir -p "$HOME/.local/bin"
        # gitleaks — download latest linux x64 tarball via gh (authed), extract binary
        rm -rf /tmp/gl && mkdir -p /tmp/gl
        gh release download --repo gitleaks/gitleaks --pattern '*linux_x64.tar.gz' --dir /tmp/gl
        tar -xzf /tmp/gl/*linux_x64.tar.gz -C "$HOME/.local/bin" gitleaks
        # osv-scanner — download latest linux amd64 bare binary via gh (authed)
        rm -rf /tmp/osv && mkdir -p /tmp/osv
        gh release download --repo google/osv-scanner --pattern '*linux_amd64' --dir /tmp/osv
        install -m 0755 /tmp/osv/*linux_amd64 "$HOME/.local/bin/osv-scanner"
        # actionlint — official download script
        bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$HOME/.local/bin"
        # zizmor — PyPI (pipx preferred, pip --user fallback); lands in ~/.local/bin.
        # PINNED on purpose. Unpinned, the runner installed whatever PyPI served that day and
        # measured 1 finding MORE than the devbox on the identical commit (190 vs 189) during
        # the v3.8.49 cycle — which cost a second rebaseline push per release, chasing a
        # number that was never the code's. The ratchet compares counts across machines, so
        # the auditor version has to be the same on both. Bump this deliberately, and
        # rebaseline in the same commit: check-workflows.mjs now prints `zizmorVersion=` next
        # to the count so the new number is traceable to the tool that produced it.
        ZIZMOR_VERSION=1.25.2
        pipx install "zizmor==$ZIZMOR_VERSION" || pip install --user "zizmor==$ZIZMOR_VERSION"
        # oasdiff — download latest linux amd64 tarball via gh (authed), extract binary
        rm -rf /tmp/oasd && mkdir -p /tmp/oasd
        gh release download --repo oasdiff/oasdiff --pattern '*linux_amd64.tar.gz' --dir /tmp/oasd
        tar -xzf /tmp/oasd/*linux_amd64.tar.gz -C "$HOME/.local/bin" oasdiff
        # ALWAYS export the bin dir (even if any step above failed)
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        # diagnostics — prove what installed on the next CI run
        ls -la "$HOME/.local/bin"
        "$HOME/.local/bin/gitleaks" version || true
        "$HOME/.local/bin/actionlint" -version || true
        "$HOME/.local/bin/osv-scanner" --version || true
        "$HOME/.local/bin/oasdiff" --version || true
        zizmor --version || true
    - name: Secret scan (gitleaks, ratchet, blocking)
      run: npm run check:secrets -- --ratchet
    - name: Vulnerability ratchet (osv-scanner, ratchet, blocking)
      run: npm run check:vuln-ratchet -- --ratchet
    - name: Workflow lint (actionlint+zizmor, ratchet, blocking)
      run: npm run check:workflows -- --ratchet
    - name: OpenAPI breaking-change (oasdiff, ratchet, blocking)
      env:
        BASE_REF: ${{ github.base_ref }}
      run: npm run check:openapi-breaking -- --ratchet
  docs-sync-strict:

      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Validate all languages
      run: |
        set -uo pipefail
        mkdir -p i18n-results
        FAIL=0
        for f in src/i18n/messages/*.json; do
          lang=$(basename "$f" .json)
          [ "$lang" = "en" ] && continue
          echo "::group::i18n $lang"
          if python3 scripts/i18n/validate_translation.py quick -l "$lang" > "i18n-results/$lang.txt" 2>&1; then
            echo "OK $lang"
          else
            FAIL=1
            echo "FAIL $lang"
            cat "i18n-results/$lang.txt"
          fi
          echo "::endgroup::"
        done
        exit "$FAIL"
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: i18n-results
        path: i18n-results/

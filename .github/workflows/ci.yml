      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: .i18n-base
        persist-credentials: false
    - name: i18n docs drift (PR — advisory, mirrors are refreshed after merge)
      if: ${{ github.event_name == 'pull_request' }}
      run: |
        set -euo pipefail
        node scripts/i18n/check-translation-drift.mjs --root .i18n-base --json --warn > /tmp/i18n-base-drift.json
        node scripts/i18n/check-translation-drift.mjs --base-report /tmp/i18n-base-drift.json --warn | tee /tmp/i18n-pr-drift.txt
        if grep -q "WARN — drift detected" /tmp/i18n-pr-drift.txt; then
          echo "::notice title=i18n mirrors pending::This PR changes English docs whose 66 mirrors are now stale. Nothing to do here: the mirrors are refreshed in the post-merge i18n batch."
        fi
    - name: i18n docs drift (sources changed since their translation)
      if: ${{ github.event_name != 'pull_request' }}
      run: node scripts/i18n/check-translation-drift.mjs

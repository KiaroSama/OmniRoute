  admission-verdict:
    name: ${{ (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.pull_request.user.login
      == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/') && github.event.pull_request.head.repo.id ==
      github.event.repository.id) && 'Gate / CI (queue-draft edit)' || 'Gate / CI' }}
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (always() && !(github.event_name == 'pull_request' && github.event.action
      == 'edited' && github.event.pull_request.user.login == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/')
      && github.event.pull_request.head.repo.id == github.event.repository.id)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
    - changes
    - lint
    - quality-gate
    - quality-extended
    - docs-sync-strict
    - docs-lint
    - i18n-ui-coverage
    - i18n-glossary-zhcn
    - i18n
    - pr-test-policy
    - build
    - package-artifact
    - electron-package-smoke
    - test-unit
    - test-bun-sqlite
    - test-vitest
    - test-coverage
    - test-e2e
    - test-integration
    - test-security
    - test-ecosystem
    - test-protocols-e2e
    - sonarqube
    - coverage-pr-comment
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        persist-credentials: false
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - name: Evaluate exact-candidate admission
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        node --input-type=module <<'JS'
        import { execFileSync } from 'node:child_process';
        import { readFileSync, mkdirSync, writeFileSync, appendFileSync } from 'node:fs';
        import { evaluateAdmission } from './scripts/quality/admission-verdict.mjs';
        const profile = 'ci';
        const sha = process.env.VALIDATION_SOURCE_SHA;
        const wrapperSha = process.env.GITHUB_SHA;
        const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
        if (!/^[a-f0-9]{40}$/.test(sha) || !/^[a-f0-9]{40}$/.test(wrapperSha)) throw Error('Invalid identity');
        if (process.env.GITHUB_EVENT_NAME !== 'push' || event.after !== wrapperSha) throw Error('Not the expected wrapper push');
        if (process.env.GITHUB_REPOSITORY !== process.env.VALIDATION_FORK || process.env.GITHUB_REF !== `refs/heads/${process.env.VALIDATION_BRANCH}`) throw Error('Unexpected validation target');
        if (execFileSync('git', ['rev-parse','HEAD'], {encoding:'utf8'}).trim() !== sha) throw Error('Wrong source checkout');
        const policy = JSON.parse(readFileSync('config/quality/admission-policy.json','utf8'));
        const report = evaluateAdmission(policy, profile, {
          event: process.env.GITHUB_EVENT_NAME, sha,
          runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
        }, JSON.parse(process.env.NEEDS_JSON));
        report.scope = 'Fork-only exact-source validation. GitHub check attaches to wrapper SHA, not upstream PR. Not a merge/publication/deployment receipt.';
        report.wrapperSha = wrapperSha;
        report.sourceSha = sha;
        report.baseSha = process.env.VALIDATION_BASE_SHA;
        report.repository = process.env.GITHUB_REPOSITORY;
        report.ref = process.env.GITHUB_REF;
        mkdirSync('.artifacts', {recursive:true});
        writeFileSync(`.artifacts/${profile}-admission.json`, JSON.stringify(report,null,2)+'\n');
        appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Fork ${policy.profiles[profile].checkName}: ${report.verdict}\n\nSource: ${sha}\n\nWrapper: ${wrapperSha}\n\n${report.errors.join('\n')}\n`);
        console.log(JSON.stringify(report,null,2));
        process.exitCode = report.verdict === 'PASS' ? 0 : 1;
        JS
    - name: Retain admission receipt
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/ci-admission.json
        if-no-files-found: error
        retention-days: 14
  ci-summary:
    name: CI Dashboard
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (!cancelled() && !(github.event_name == 'pull_request' && github.event.action
      == 'edited' && github.event.pull_request.user.login == 'mergify[bot]' && startsWith(github.head_ref, 'mergify/merge-queue/')
      && github.event.pull_request.head.repo.id == github.event.repository.id)) }}
    needs:
    - changes
    - lint
    - docs-sync-strict
    - i18n-ui-coverage
    - i18n-glossary-zhcn
    - i18n
    - pr-test-policy
    - build
    - package-artifact
    - electron-package-smoke
    - test-unit
    - test-coverage
    - sonarqube
    - coverage-pr-comment
    - test-e2e
    - test-integration
    - test-security
    - test-ecosystem
    - test-protocols-e2e
    steps:
    - name: Download i18n results
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: i18n-*
        path: results
        merge-multiple: true
    - name: Generate dashboard
      env:
        EVENT_NAME: ${{ github.event_name }}
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        status() {
          case "$1" in
            success) echo "🟢 PASS" ;;
            failure) echo "🔴 FAIL" ;;
            cancelled) echo "⚫ CANCELLED" ;;
            skipped) echo "⚪ SKIPPED" ;;
            *) echo "🟡 UNKNOWN" ;;
          esac
        }

        {
          echo "# 🚀 CI Dashboard"
          echo ""

          # (gap 12) A cancelled job never reported a verdict, and in a long table that reads the
          # same as a green one. `cancel-in-progress` plus incremental fixing cancels jobs on every
          # push, and this cycle the Vitest job was cancelled in rounds 1, 2 and 3 — it only ran to
          # completion in round 4, where it revealed a suite that had been broken the whole cycle
          # plus two production bugs. A gate that never finishes is indistinguishable from one that
          # passes, so name them at the TOP instead of leaving them to be spotted mid-table.
          CANCELLED_JOBS=$(printf '%s' "$NEEDS_JSON" \
            | jq -r 'to_entries | map(select(.value.result == "cancelled")) | .[].key' 2>/dev/null \
            | sort | paste -sd", " -) || CANCELLED_JOBS=""
          if [ -n "$CANCELLED_JOBS" ]; then
            {
              echo "> ### ⚫ Cancelled — no verdict was reported"
              echo ">"
              echo "> \`$CANCELLED_JOBS\`"
              echo ">"
              echo "> These did not fail; they never finished, so nothing was checked. Treat this"
              echo "> run as INCOMPLETE for those gates. If the cancellation came from"
              echo "> \`cancel-in-progress\` on a newer push, the newer run covers it — otherwise"
              echo "> re-run them before reading this dashboard as green."
              echo ""
            }
          fi

          echo "## 🧱 Core Checks"
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| Change Classification | $(status '${{ needs.changes.result }}') |"
          echo "| Lint | $(status '${{ needs.lint.result }}') |"
          echo "| Docs Sync (Strict) | $(status '${{ needs.docs-sync-strict.result }}') |"
          echo "| i18n UI Coverage | $(status '${{ needs.i18n-ui-coverage.result }}') |"
          echo "| i18n Glossary (zh-CN, ko) | $(status '${{ needs.i18n-glossary-zhcn.result }}') |"
          echo "| PR Test Policy | $(status '${{ needs.pr-test-policy.result }}') |"
          echo "| SonarQube (opt-in; disabled without SONARQUBE_ENABLED=true) | $(status '${{ needs.sonarqube.result }}') |"

          echo ""
          echo "## 🏗️ Build"
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| Build Matrix | $(status '${{ needs.build.result }}') |"
          echo "| Package Artifact | $(status '${{ needs.package-artifact.result }}') |"
          echo "| Electron Package Smoke | $(status '${{ needs.electron-package-smoke.result }}') |"

          echo ""
          echo "## 🧪 Tests"
          echo "| Suite | Status |"
          echo "|-------|--------|"
          echo "| Unit | $(status '${{ needs.test-unit.result }}') |"
          echo "| Coverage | $(status '${{ needs.test-coverage.result }}') |"
          echo "| PR Coverage Comment | $(status '${{ needs.coverage-pr-comment.result }}') |"
          echo "| E2E | $(status '${{ needs.test-e2e.result }}') |"
          echo "| Integration | $(status '${{ needs.test-integration.result }}') |"
          echo "| Security Tests | $(status '${{ needs.test-security.result }}') |"
          echo "| Ecosystem E2E | $(status '${{ needs.test-ecosystem.result }}') |"
          echo "| Protocol Clients E2E (advisory, #10049) | $(status '${{ needs.test-protocols-e2e.result }}') |"

          echo ""
          echo "## 🌍 Translations"

          total=0
          langs=0

          if [ -d results ]; then
            for file in results/*.txt; do
              [ -f "$file" ] || continue
              val=$(sed -r 's/\x1B\[[0-9;]*[mK]//g' "$file" | grep "Untranslated:" | awk '{print $2}')
              val=${val:-0}
              total=$((total + val))
              langs=$((langs + 1))
            done
          fi

          echo ""
          echo "| Metric | Value |"
          echo "|--------|------|"
          echo "| Languages checked | $langs |"
          echo "| Total untranslated | $total |"

          if [ "$total" -gt 0 ]; then
            echo ""
            echo "⚠️ **Translations need attention**"
          else
            echo ""
            echo "✅ **All translations complete**"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

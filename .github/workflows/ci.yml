  test-coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test-unit
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (!cancelled() && needs.test-unit.result == 'success') }}
    env:
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
    steps:
    - name: Free hosted runner disk
      if: ${{ runner.environment == 'github-hosted' }}
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
        df -h /
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        ref: 99699ff06eb08df5c629de8889bf2575fbfcc25c
        repository: KiaroSama/OmniRoute
    - name: Verify pinned source and record wrapper identity
      shell: bash
      run: |
        set -eu
        actual=$(git rev-parse HEAD)
        test "$actual" = "$VALIDATION_SOURCE_SHA" || { echo "Wrong source checkout" >&2; exit 1; }
        printf 'Source commit: %s\nWrapper commit: %s\n' "$actual" "$GITHUB_SHA"
        printf 'Validated source: `%s`\n\nWorkflow wrapper: `%s`\n' "$actual" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@v7
      with:
        package-manager-cache: false
        node-version: ${{ env.CI_NODE_VERSION }}
    - uses: ./.github/actions/npm-ci-retry
      with:
        cache: ${{ github.event_name == 'pull_request' }}
    - name: Download all shard coverage
      uses: actions/download-artifact@v8
      with:
        pattern: coverage-shard-*
        path: coverage-shards/
        merge-multiple: true
    - name: Merge + report + gate
      env:
        NODE_OPTIONS: --max-old-space-size=8192
        EVENT_NAME: ${{ github.event_name }}
      run: |
        LCOV_REPORTER=()
        if [ "$EVENT_NAME" != "pull_request" ]; then LCOV_REPORTER=(--reporter=lcov); fi
        mkdir -p coverage
        first_coverage_file=""
        if [ -d coverage-shards ]; then
          first_coverage_file="$(find coverage-shards -maxdepth 1 -type f -name '*.json' -print -quit)"
        fi
        if [ -z "$first_coverage_file" ]; then
          echo "::error::No raw coverage shard data was downloaded."
          find . -maxdepth 3 -type f | sort
          exit 1
        fi
        # Gate aligned to the project's local coverage bar: `npm run test:coverage`
        # gates at 60/60/60/60, so CI must match it (the previous CI floor of 40
        # silently undershot the local bar — a real drift). Real merged coverage is
        # ~79/79/82/75, so 60 is a conservative floor with headroom; the Fase-4
        # coverage ratchet (quality-baseline.json) layers "must not drop vs baseline"
        # on top of this floor.
        npx c8 report \
          --temp-directory coverage-shards \
          --reports-dir coverage \
          --merge-async \
          --reporter=text-summary \
          --reporter=json-summary \
          "${LCOV_REPORTER[@]}" \
          --exclude=tests/** \
          --exclude=**/*.test.* \
          --check-coverage \
          --statements 60 --lines 60 --functions 60 --branches 60
    - name: Build coverage summary
      if: always()
      run: |
        mkdir -p coverage
        if [ -f coverage/coverage-summary.json ]; then
          node scripts/check/test-report-summary.mjs \
            --input coverage/coverage-summary.json \
            --output coverage/coverage-report.md \
            --threshold 60
        else
          printf '%s\n' \
            '# Coverage Report' \
            '' \
            'Coverage summary JSON was not generated. Inspect the Coverage job logs.' \
            > coverage/coverage-report.md
        fi
        cat coverage/coverage-report.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage to Codecov (informational)
      if: ${{ false }}
      timeout-minutes: 5
      continue-on-error: true
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        files: coverage/lcov.info
        fail_ci_if_error: false
    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          coverage/coverage-summary.json
          coverage/coverage-report.md
          coverage/lcov.info
        if-no-files-found: warn

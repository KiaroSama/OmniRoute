    name: i18n Validation (all languages)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.repository == 'KiaroSama/OmniRoute' && (github.event_name != 'pull_request' || ((github.event.pull_request.draft
      == false || needs.changes.outputs.queueCandidate == 'true') && needs.changes.outputs.i18n == 'true')) }}
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
      with:
